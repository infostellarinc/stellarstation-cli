syntax = "proto3";

package stellarstation.starpass.v1.orbit;

option go_package = "stellarstation.com/grpcapis/starpass/v1/orbit";

option java_multiple_files = true;
option java_package = "com.stellarstation.starpass.v1.orbit";

// Types exchanged between the cloud and a StarPass ground station during a
// pass.

// Messages related to satellite orbits.

// Unparsed TLE data for a satellite - https://en.wikipedia.org/wiki/Two-line_element_set
message Tle {
  // The first line of the TLE. Not a title line.
  string line_1 = 1;

  // The second line of the TLE.
  string line_2 = 2;
}
